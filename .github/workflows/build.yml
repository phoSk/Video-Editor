name: Publicar app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: publicar
  cancel-in-progress: true

jobs:
  web:
    name: App web (PC y navegador)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - name: Número de versión
        run: echo "{\"build\":${{ github.run_number }}}" > www/version.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: www
      - id: deploy
        uses: actions/deploy-pages@v4

  android:
    name: APK de Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3

      - name: Compilar APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: bash scripts/build-android.sh

      - uses: actions/upload-artifact@v5
        with:
          name: editor-video-apk
          path: editor-video.apk

      - name: Publicar versión
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ github.run_number }}" editor-video.apk \
            --title "Versión 1.0.${{ github.run_number }}" \
            --notes "Descarga editor-video.apk en tu móvil Android e instálala." \
            --latest || { echo "::error::No se pudo crear la versión en Releases"; exit 1; }

      - name: Aviso de fallo
        if: failure()
        run: echo "::error::Ha fallado un paso de preparación o de publicación del trabajo de Android"
